# cfn/taxdocs-network-dev.yaml
# 3-AZ VPC: public/private subnets, IGW, NAT (one in dev; per-AZ when
# EnvName is staging/prod), application security group.
#
# IsProdLike gates NatGatewayBPerAz / NatGatewayCPerAz so dev pays for
# a single NAT (all private RTs share NatGatewayA) and staging/prod get
# NAT-per-AZ for HA. tcp/5432 app→RDS egress is added in Task 3 against
# Export taxdocs-network-dev-AppSgId so this stack can CREATE first.
AWSTemplateFormatVersion: "2010-09-09"
Description: taxdocs network — 3-AZ VPC, public/private subnets, IGW, conditional NAT, app SG

Parameters:
  EnvName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Environment. Controls NAT count (one in dev, one per AZ otherwise).

  VpcCidr:
    Type: String
    Default: 10.40.0.0/16
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(1[6-9]|2[0-8]))$'
    ConstraintDescription: Must be a valid IPv4 CIDR between /16 and /28.
    Description: VPC CIDR. Eight /24s are carved with !Cidr [VpcCidr, 8, 8].

Conditions:
  # Gate: staging/prod get NAT-per-AZ (NatGatewayBPerAz / NatGatewayCPerAz +
  # their route tables). Dev must not pay for three NATs.
  IsProdLike: !Or
    - !Equals [!Ref EnvName, staging]
    - !Equals [!Ref EnvName, prod]
  # Gate: inverse of IsProdLike. Private B/C associate to PrivateRouteTableA
  # so they share NatGatewayA.
  IsDev: !Not [!Condition IsProdLike]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W60
            reason: VPC Flow Logs are a platform cost; not required for this capstone VPC.
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub taxdocs-network-${EnvName}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub taxdocs-network-${EnvName}-igw

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W33
            reason: Public subnets must MapPublicIpOnLaunch so NAT/IGW-facing hosts get a public IP.
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 8, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub taxdocs-network-${EnvName}-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W33
            reason: Public subnets must MapPublicIpOnLaunch so NAT/IGW-facing hosts get a public IP.
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 8, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub taxdocs-network-${EnvName}-public-b

  PublicSubnetC:
    Type: AWS::EC2::Subnet
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W33
            reason: Public subnets must MapPublicIpOnLaunch so NAT/IGW-facing hosts get a public IP.
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [2, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 8, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub taxdocs-network-${EnvName}-public-c

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 8, 8]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub taxdocs-network-${EnvName}-private-a

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [4, !Cidr [!Ref VpcCidr, 8, 8]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub taxdocs-network-${EnvName}-private-b

  PrivateSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [2, !GetAZs ""]
      CidrBlock: !Select [5, !Cidr [!Ref VpcCidr, 8, 8]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub taxdocs-network-${EnvName}-private-c

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub taxdocs-network-${EnvName}-public-rt

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetAAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetCAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetC
      RouteTableId: !Ref PublicRouteTable

  NatEipA:
    Type: AWS::EC2::EIP
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc

  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipA.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub taxdocs-network-${EnvName}-nat-a
        - Key: service
          Value: taxdocs
        - Key: env
          Value: !Ref EnvName
        - Key: tenant
          Value: shared
        - Key: feature
          Value: summarize-document

  NatEipB:
    Type: AWS::EC2::EIP
    Condition: IsProdLike
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc

  NatGatewayBPerAz:
    Type: AWS::EC2::NatGateway
    Condition: IsProdLike
    Properties:
      AllocationId: !GetAtt NatEipB.AllocationId
      SubnetId: !Ref PublicSubnetB
      Tags:
        - Key: Name
          Value: !Sub taxdocs-network-${EnvName}-nat-b
        - Key: service
          Value: taxdocs
        - Key: env
          Value: !Ref EnvName
        - Key: tenant
          Value: shared
        - Key: feature
          Value: summarize-document

  NatEipC:
    Type: AWS::EC2::EIP
    Condition: IsProdLike
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc

  NatGatewayCPerAz:
    Type: AWS::EC2::NatGateway
    Condition: IsProdLike
    Properties:
      AllocationId: !GetAtt NatEipC.AllocationId
      SubnetId: !Ref PublicSubnetC
      Tags:
        - Key: Name
          Value: !Sub taxdocs-network-${EnvName}-nat-c
        - Key: service
          Value: taxdocs
        - Key: env
          Value: !Ref EnvName
        - Key: tenant
          Value: shared
        - Key: feature
          Value: summarize-document

  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub taxdocs-network-${EnvName}-private-rt-a

  PrivateDefaultRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA

  PrivateSubnetAAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTableA

  PrivateSubnetBAssociationDev:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: IsDev
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTableA

  PrivateSubnetCAssociationDev:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: IsDev
    Properties:
      SubnetId: !Ref PrivateSubnetC
      RouteTableId: !Ref PrivateRouteTableA

  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Condition: IsProdLike
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub taxdocs-network-${EnvName}-private-rt-b

  PrivateDefaultRouteB:
    Type: AWS::EC2::Route
    Condition: IsProdLike
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayBPerAz

  PrivateSubnetBAssociationProdLike:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: IsProdLike
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTableB

  PrivateRouteTableC:
    Type: AWS::EC2::RouteTable
    Condition: IsProdLike
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub taxdocs-network-${EnvName}-private-rt-c

  PrivateDefaultRouteC:
    Type: AWS::EC2::Route
    Condition: IsProdLike
    Properties:
      RouteTableId: !Ref PrivateRouteTableC
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayCPerAz

  PrivateSubnetCAssociationProdLike:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: IsProdLike
    Properties:
      SubnetId: !Ref PrivateSubnetC
      RouteTableId: !Ref PrivateRouteTableC

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W40
            reason: App must reach the public internet on 443; ingress is VPC-CIDR only.
          - id: W5
            reason: Egress 443 to 0.0.0.0/0 is required; no 0.0.0.0/0 ingress.
    Properties:
      GroupDescription: taxdocs app; ingress 8080 from VPC; egress 443. tcp/5432 to RDS SG is Task 3.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref VpcCidr
          Description: App port from inside the VPC only (not 0.0.0.0/0)
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to the internet
      Tags:
        - Key: Name
          Value: !Sub taxdocs-network-${EnvName}-app-sg

Outputs:
  VpcId:
    Description: VPC ID.
    Value: !Ref Vpc
    Export:
      Name: !Sub taxdocs-network-${EnvName}-VpcId

  PublicSubnets:
    Description: Comma-joined public subnet IDs (A,B,C).
    Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB, !Ref PublicSubnetC]]
    Export:
      Name: !Sub taxdocs-network-${EnvName}-PublicSubnets

  PrivateSubnets:
    Description: Comma-joined private subnet IDs (A,B,C).
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB, !Ref PrivateSubnetC]]
    Export:
      Name: !Sub taxdocs-network-${EnvName}-PrivateSubnets

  AppSgId:
    Description: Application security group. Task 3 imports this for RDS 5432 egress.
    Value: !Ref AppSecurityGroup
    Export:
      Name: !Sub taxdocs-network-${EnvName}-AppSgId
