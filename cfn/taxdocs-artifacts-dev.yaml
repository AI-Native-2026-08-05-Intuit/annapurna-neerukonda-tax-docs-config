# cfn/taxdocs-artifacts-dev.yaml
# Hardened artefact bucket. DeletionPolicy AND UpdateReplacePolicy are both
# Retain so stack delete or a BucketName replacement does not drop objects.
AWSTemplateFormatVersion: "2010-09-09"
Description: taxdocs artefacts — KMS, PAB, IA then Glacier IR, deny-non-TLS

Parameters:
  EnvName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Environment name applied to the artefact bucket Environment tag.

Resources:
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W35
            reason: Access logging is out of scope for this capstone artefact bucket.
    Properties:
      BucketName: uptimecrew-taxdocs-artifacts-dev
      Tags:
        - Key: Environment
          Value: !Ref EnvName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: alias/aws/s3
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToIaThenGlacierIr
            Status: Enabled
            Transitions:
              - TransitionInDays: 90
                StorageClass: STANDARD_IA
              - TransitionInDays: 365
                StorageClass: GLACIER_IR
          - Id: ExpireNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90

  ArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyNonTLS
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ArtifactsBucket.Arn
              - !Sub ${ArtifactsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

Outputs:
  EnvironmentName:
    Description: Environment this artefact stack was deployed for.
    Value: !Ref EnvName

  ArtifactsBucketName:
    Description: Hardened artefact bucket name.
    Value: !Ref ArtifactsBucket
    Export:
      Name: !Sub ${AWS::StackName}-BucketName

  ArtifactsBucketArn:
    Description: Hardened artefact bucket ARN.
    Value: !GetAtt ArtifactsBucket.Arn
    Export:
      Name: !Sub ${AWS::StackName}-BucketArn
