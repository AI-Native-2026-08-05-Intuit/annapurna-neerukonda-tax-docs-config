# overlays/dev/kustomization.yaml
# The dev overlay -- the smallest viable patch over the W5 D3 base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind:       Kustomization

resources:
  - ../../base

namespace: taxdocs-dev

commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"

images:
  - name:    uptimecrew/taxdocs-api
    newName: uptimecrew/taxdocs-api
    newTag:  1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f1f

replicas:
  - name:  taxdocs-api
    count: 1

patches:
  - target:
      kind: ConfigMap
      name: taxdocs-api-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: dev
      - op: replace
        path: /data/LOG_LEVEL
        value: DEBUG
