# overlays/dev/kustomization.yaml
# The dev overlay -- the smallest viable patch over the W5 D3 base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind:       Kustomization

resources:
  - ../../base

namespace: taxdocs-dev

# Namespace (and every resource in this overlay) lands at wave -1 so
# a brand-new cluster creates the Namespace before dependents wait
# on CreateNamespace=true alone. Application-level waves still order
# dev (0) before staging (1) before prod (2).
commonAnnotations:
  argocd.argoproj.io/sync-wave: "-1"

images:
  - name:    uptimecrew/taxdocs-api
    newName: uptimecrew/taxdocs-api
    newTag:  "0.1.4"

replicas:
  - name:  taxdocs-api
    count: 1

patches:
  - target:
      kind: ConfigMap
      name: taxdocs-api-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: dev
      - op: replace
        path: /data/LOG_LEVEL
        value: DEBUG
