# overlays/dev/kustomization.yaml
# The dev overlay -- the smallest viable patch over the W5 D3 base.
# Namespace wave lives on base/00-namespace.yaml (-1), not commonAnnotations.
apiVersion: kustomize.config.k8s.io/v1beta1
kind:       Kustomization

resources:
  - ../../base

namespace: taxdocs-dev

images:
  - name:    public.ecr.aws/k8x3k0u5/uptimecrew/taxdocs-api
    newName: public.ecr.aws/k8x3k0u5/uptimecrew/taxdocs-api
    newTag:  "0.1.4"

replicas:
  - name:  taxdocs-api
    count: 1

patches:
  - target:
      kind: ConfigMap
      name: taxdocs-api-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: dev
      - op: replace
        path: /data/LOG_LEVEL
        value: DEBUG
      - op: replace
        path: /data/LOGGING_LEVEL_ROOT
        value: DEBUG
