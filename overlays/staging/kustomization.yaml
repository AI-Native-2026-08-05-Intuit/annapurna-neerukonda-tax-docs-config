# overlays/staging/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind:       Kustomization

resources:
  - ../../base

namespace: taxdocs-staging

commonAnnotations:
  argocd.argoproj.io/sync-wave: "-1"

images:
  - name:    uptimecrew/taxdocs-api
    newName: uptimecrew/taxdocs-api
    newTag:  "0.1.4"

replicas:
  - name:  taxdocs-api
    count: 2

patches:
  - target:
      kind: ConfigMap
      name: taxdocs-api-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: staging
      - op: replace
        path: /data/LOG_LEVEL
        value: INFO
