# argocd/projects/taxdocs.yaml
# AppProject scoping the taxdocs capstone team.
# The platform team owns this file in practice; the app team
# proposes changes via PR. Every Application in this assignment
# has spec.project = taxdocs -- never "default".
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: taxdocs
  namespace: argocd
  # Finalizer ensures Argo CD prunes generated Applications when
  # the project itself is deleted -- a defence against orphaned
  # workloads if the project is ever retired.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: taxdocs-api capstone -- GitOps overlays + observability

  # WHICH repos may an Application in this project use as source?
  # No '*'. Curriculum name is https://github.com/uptimecrew/taxdocs-config.git
  # (this cohort's fork is the Intuit URL below — the only repo we can clone).
  sourceRepos:
    - https://github.com/AI-Native-2026-08-05-Intuit/annapurna-neerukonda-tax-docs-config.git

  # WHICH (cluster, namespace) pairs are legal?
  # The k3d cluster is reachable via the in-cluster service DNS.
  # Each env has its own namespace -- explicit, not globbed.
  destinations:
    - server:    https://kubernetes.default.svc
      namespace: taxdocs-dev
    - server:    https://kubernetes.default.svc
      namespace: taxdocs-staging
    - server:    https://kubernetes.default.svc
      namespace: taxdocs-prod

  # Cluster-scoped resources: the app team has NO business creating
  # ClusterRoles, CustomResourceDefinitions, or PersistentVolumes.
  # Empty whitelist = full deny. Platform team manages those.
  clusterResourceWhitelist: []

  # Namespace-scoped resources: only the kinds the W5 D3 manifests
  # actually use. Anything else is denied -- a compromised config
  # repo cannot smuggle in a privileged DaemonSet.
  namespaceResourceWhitelist:
    - {group: "",                       kind: Namespace}
    - {group: "",                       kind: Service}
    - {group: "",                       kind: ConfigMap}
    - {group: "",                       kind: Secret}
    - {group: "",                       kind: ServiceAccount}
    - {group: apps,                     kind: Deployment}
    - {group: autoscaling,              kind: HorizontalPodAutoscaler}
    - {group: policy,                   kind: PodDisruptionBudget}
    - {group: networking.k8s.io,        kind: NetworkPolicy}
    - {group: monitoring.coreos.com,    kind: ServiceMonitor}
    - {group: monitoring.coreos.com,    kind: PrometheusRule}

  # Explicitly block quota knobs -- the platform team owns those.
  namespaceResourceBlacklist:
    - {group: "", kind: ResourceQuota}
    - {group: "", kind: LimitRange}

  # Sync windows: deny auto-sync to prod over the weekend.
  # Manual sync still works (manualSync: true on the allow side),
  # but the controller will not promote on its own.
  syncWindows:
    - kind: deny
      schedule: "0 17 * * 5"        # Friday 17:00
      duration: 60h                 # through Monday 05:00
      applications:
        - "taxdocs-api-prod"
      manualSync: true              # human can still force-sync on-call

  # Project-scoped RBAC -- two roles, not "any-developer-is-admin".
  roles:
    # Developers: read + sync in dev/staging; cannot touch prod.
    - name: developers
      description: Read everything; sync dev and staging only.
      policies:
        - p, proj:taxdocs:developers, applications, get,    taxdocs/*,                allow
        - p, proj:taxdocs:developers, applications, sync,   taxdocs/taxdocs-api-dev,   allow
        - p, proj:taxdocs:developers, applications, sync,   taxdocs/taxdocs-api-staging, allow
        - p, proj:taxdocs:developers, applications, delete, taxdocs/*,                deny
        - p, proj:taxdocs:developers, logs,         get,    taxdocs/*,                allow
      groups:
        - uptimecrew:taxdocs-engineers
    # Releasers: full sync including prod; still cannot override the
    # project's allow-lists (those live above).
    - name: releasers
      description: Full sync including prod. Cannot delete Applications.
      policies:
        - p, proj:taxdocs:releasers, applications, get,    taxdocs/*, allow
        - p, proj:taxdocs:releasers, applications, sync,   taxdocs/*, allow
        - p, proj:taxdocs:releasers, applications, action/*, taxdocs/*, allow
        - p, proj:taxdocs:releasers, applications, delete, taxdocs/*, deny
      groups:
        - uptimecrew:taxdocs-engineers-releasers
