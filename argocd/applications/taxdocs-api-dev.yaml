# REFERENCE ONLY. Do not kubectl apply this file once the ApplicationSet
# is installed: both objects are named taxdocs-api-dev and the last apply
# wins. Task 3's ApplicationSet owns the live Application. Keep this file
# so a newcomer can read one concrete spec (project, finalizer, prune,
# selfHeal, CreateNamespace, ServerSideApply) without decoding the matrix.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taxdocs-api-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    env:  dev
    team: taxdocs
  annotations:
    notifications.argoproj.io/subscribe.on-sync-failed.slack: argocd-notifications
    notifications.argoproj.io/subscribe.on-health-degraded.slack: argocd-notifications
spec:
  # MUST be the project name -- never "default".
  project: taxdocs

  source:
    repoURL:        https://github.com/AI-Native-2026-08-05-Intuit/annapurna-neerukonda-tax-docs-config.git
    path:           overlays/dev
    targetRevision: main

  destination:
    server:    https://kubernetes.default.svc
    namespace: taxdocs-dev

  syncPolicy:
    automated:
      prune:      true
      selfHeal:   true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration:    10s
        factor:      2
        maxDuration: 3m
