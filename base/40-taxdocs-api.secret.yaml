# Placeholder Secret so the Deployment's secretRef exists until W6 D3 ESO.
# Do not put real passwords here. stringData is a dummy so the pod can start
# far enough for Argo CD health; rotate via External Secrets later.
apiVersion: v1
kind: Secret
metadata:
  name: taxdocs-api-secrets
  namespace: taxdocs-dev
  labels:
    app.kubernetes.io/name: taxdocs-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: taxdocs
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: replace-at-apply-time-from-secrets-manager
