# ServiceMonitor for taxdocs-api. release: kube-prometheus-stack is required
# so the Prometheus Operator's default serviceMonitorSelector matches.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: taxdocs-api
  namespace: taxdocs-dev
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: taxdocs-api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: taxdocs-api
  namespaceSelector:
    matchNames:
      - taxdocs-dev
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s
