# KEDA scale target for the Kafka-backed read-model worker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taxdocs-api-worker
  namespace: taxdocs-dev
  labels:
    app.kubernetes.io/name: taxdocs-api-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: taxdocs
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: taxdocs-api-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taxdocs-api-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: taxdocs
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: worker
          image: public.ecr.aws/k8x3k0u5/uptimecrew/taxdocs-api:0.1.5
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: taxdocs-api-config
            - secretRef:
                name: taxdocs-api-secrets
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: worker
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka.taxdocs-dev.svc.cluster.local:9092
            - name: SPRING_KAFKA_LISTENER_AUTO_STARTUP
              value: "true"
            - name: TAXDOCS_OUTBOX_PUBLISHER_ENABLED
              value: "false"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
