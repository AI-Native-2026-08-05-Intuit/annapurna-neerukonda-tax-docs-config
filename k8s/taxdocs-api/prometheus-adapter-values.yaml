prometheus:
  url: http://kube-prometheus-stack-prometheus.monitoring.svc
  port: 9090

rules:
  default: false
  custom:
    - seriesQuery: 'taxdocs_inflight_requests{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: "taxdocs_inflight_requests"
        as: taxdocs_inflight_requests
      metricsQuery: 'avg_over_time(taxdocs_inflight_requests{<<.LabelMatchers>>}[1m])'
