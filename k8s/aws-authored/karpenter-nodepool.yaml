# AUTHOR-ONLY: Karpenter provisions EC2 nodes and cannot run on k3d; do not apply this file locally.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: taxdocs-mixed
spec:
  template:
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["m5.large", "m5.xlarge", "m6i.large"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["us-east-1a", "us-east-1b", "us-east-1c"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 600s
  # A runaway HPA must not create an unbounded EC2 bill. During consolidation,
  # the API PDB preserves the two-pod serving floor while Karpenter moves pods.
  limits:
    cpu: "200"
    memory: 400Gi
